# Opt-in only: use SPRING_PROFILES_ACTIVE=demo,cloudsql for the hackathon deployment.
# DB_URL is used by local runs; this profile derives the URL from DB_NAME instead.
spring.datasource.url=jdbc:mysql:///${DB_NAME}?connectionTimeZone=Asia/Seoul
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# The Java Connector authenticates with the Cloud Run service account (ADC).
# Never embed passwords or service-account key files in the JDBC URL or image.
spring.datasource.hikari.data-source-properties.socketFactory=com.google.cloud.sql.mysql.SocketFactory
spring.datasource.hikari.data-source-properties.cloudSqlInstance=${CLOUD_SQL_INSTANCE_CONNECTION_NAME}
spring.datasource.hikari.data-source-properties.ipTypes=${CLOUD_SQL_IP_TYPES:PUBLIC}
spring.datasource.hikari.data-source-properties.cloudSqlRefreshStrategy=lazy
spring.datasource.hikari.data-source-properties.connectTimeout=10000

# Limits apply per application instance, not to the entire Cloud Run service.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Explicit opt-in; local/demo runs retain container-managed sessions.
app.session.jdbc.enabled=true
