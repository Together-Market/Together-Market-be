spring.application.name=together-market
server.address=0.0.0.0
server.port=${PORT:8080}
spring.profiles.default=local
kakao.local.rest-api-key=${KAKAO_REST_API_KEY:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
product.images.bucket=${PRODUCT_IMAGE_BUCKET:}
product.images.public-base-url=${PRODUCT_IMAGE_PUBLIC_BASE_URL:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/together_market}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Session IDs travel only in HttpOnly cookies, never URL parameters.
server.servlet.session.cookie.http-only=true
server.servlet.session.tracking-modes=cookie
