# Explicit hackathon configuration. Question and reservation policy values are demo choices.
recommendation.api.enabled=true
recommendation.persistence.enabled=true
recommendation.execution.enabled=true
recommendation.customer-read.enabled=true
recommendation.customer-read.visible-sale-statuses=ON_SALE,SOLD_OUT,PAUSED
recommendation.customer-read.coordinate-policy=DETAIL_NULL_MAP_NULL
recommendation.alternatives.pickup-policy=PURCHASE_REQUEST
recommendation.questions.use-demo-draft=true
recommendation.ai.enabled=true
recommendation.ai.provider=gemini
recommendation.ranker.mode=demo
reservation.approval-window=${RESERVATION_APPROVAL_WINDOW:PT30M}
