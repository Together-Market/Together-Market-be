name: 작업 이슈
description: 기능·오류·설정·문서 작업
body:
  - type: dropdown
    id: type
    attributes:
      label: 작업 유형
      options: [feat, fix, refactor, chore, docs, test]
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: 작업 목적
      description: 필요한 이유와 기대하는 결과를 작성해주세요.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 내용
      description: 수행할 작업을 구체적으로 작성해주세요.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 완료 기준
      description: 완료를 확인할 방법을 작성해주세요.
    validations:
      required: true
